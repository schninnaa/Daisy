<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This is DAISY</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Quicksand&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    padding: 2rem;
    background: linear-gradient(135deg, #ffdef5, #c7d2ff);
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  .title-container {
    display: flex;
    align-items: center;
    margin-bottom: 2rem;
    gap: 2rem;
  }

  .title-container img {
    max-height: 200px;
    object-fit: contain;
    margin: 0;
    box-shadow: none;
  }

  h2 {
    font-family: 'Quicksand', cursive;
    font-size: 3rem;
    color: #ff9cfb;
    background: linear-gradient(90deg, #FFA3D4, #F4A3FF, #D9A3FF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative;
  }

  h2::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
    transform: skewX(-25deg);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer { 0% { left:-100%; } 100% { left:100%; } }

  model-viewer {
    width: 100%;
    max-width: 600px;
    height: 500px;
    border-radius: 20px;
    outline: none !important;
    border: none !important;
    box-shadow: none;
    --poster-color: transparent;
    --shadow-intensity: 0;
  }

  .description {
    font-family: 'Quicksand', sans-serif;
    font-size: 1.2rem;
    font-weight: bold;
    color: #ff6cfb;
    text-align: center;
    margin-top: 1.5rem;
    line-height: 1.5;
    max-width: 600px;
  }

  /* Simplified buttons */
  button, a button {
    padding:0.8rem 1.5rem;
    border-radius:15px;
    border:none;
    background:#ff3ca6;
    color:#fff;
    font-family:'Quicksand',sans-serif;
    font-weight:bold;
    cursor:pointer;
    box-shadow: inset -2px -2px 4px rgba(255,255,255,0.5),
                inset 2px 2px 4px rgba(0,0,0,0.2);
    transition: transform 0.15s;
  }

  button:hover, a button:hover {
    transform: scale(1.05);
  }

  /* Hearts & comments containers */
  #hearts-container, #comments-container { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }

  .heart { position:absolute; width:70px; height:70px; animation: floatHeart 3s ease-in-out forwards; opacity:0; }
  @keyframes floatHeart { 0%{transform:translateY(0) scale(0.5);opacity:0;} 10%{opacity:1;} 100%{transform:translateY(-100px) scale(1);opacity:0;} }

  .comment {
    position:absolute;
    font-size:1.8rem;
    font-weight:bold;
    color:#ff6cfb;
    background: rgba(255,255,255,0.2);
    padding:2px 6px;
    border-radius:12px;
    animation: floatComment 4s ease-in-out forwards;
    white-space: nowrap;
  }
  @keyframes floatComment { 0%{transform:translateY(0) scale(0.8);opacity:0;} 10%{opacity:1;} 100%{transform:translateY(-120px) scale(1);opacity:0;} }

  /* Comment input */
  .comment-box-container { width:90%; max-width:600px; margin:2rem auto; display:flex; gap:0.5rem; align-items:center; }
  .comment-box-container input {
    flex:1; padding:0.8rem 1rem; font-size:1rem; font-weight:bold;
    border-radius:15px; border:none; outline:none;
    background:#ffcdfd; color:#ff3ca6;
    font-family:'Quicksand',sans-serif;
    box-shadow: inset -2px -2px 4px rgba(255,255,255,0.5),
                inset 2px 2px 4px rgba(0,0,0,0.2);
  }

  .comment-box-container button { padding:0.8rem 1.2rem; }

  @media(max-width:600px){
    .title-container { flex-direction:column; gap:1rem; align-items:center; }
    .title-container img { max-width:80%; }
    h2 { font-size:2rem; text-align:center; }
    .description { font-size:1rem; padding:0 1rem; }
    .comment { font-size:0.9rem; }
  }
</style>
</head>

<body>
  <button id="musicToggle" style="position:fixed;top:18px;right:18px;z-index:99;">🔇 Music</button>

  <div id="hearts-container"></div>
  <div id="comments-container"></div>

  <div class="title-container">
    <img src="7A819726-1F62-4904-8B36-1AFF755FA06D.png" alt="Left">
    <h2>HEY DAISY</h2>
    <img src="F05D0008-169D-411E-95B7-F47578DDF2E9.png" alt="Right">
  </div>

  <model-viewer src="DAISY3D.glb" ios-src="DAISY3D.usdz" alt="Daisy" ar auto-rotate camera-controls ar-modes="webxr scene-viewer quick-look" environment-image="neutral"></model-viewer>

  <button class="reaction-button" id="reactionButton">♥︎ My honest reaction ♥︎</button>
  <audio id="reactionSound" src="aww.mp3"></audio>
  <audio id="kawaiiMusic" src="kawaii.mp3" loop></audio>

  <p class="description">
    Daisy is a 5 year old Bearded Dragon! She loves to eat carrots and crickets and taking naps under her tree bark. She's usually pretty chill and just stares at you all day, but occasionally she loves to follow your movements when she's extra hungry!
  </p>

  <div style="width:100%; display:flex; justify-content:center; gap:1.5rem; margin-top:3rem; margin-bottom:2rem;">
    <a href="https://lorrritta.github.io/Projekt_Loretta/"><button>TAKE ME BACK</button></a>
    <a href="https://julypetry.github.io/projekt3d/"><button>WHAT'S NEXT?!</button></a>
  </div>

  <div class="comment-box-container">
    <input type="text" id="userComment" placeholder="Write a cute comment..." />
    <button id="sendComment">Send</button>
  </div>

<script>
  // Music
  document.addEventListener('DOMContentLoaded', () => {
    const music = document.getElementById('kawaiiMusic');
    const musicToggle = document.getElementById('musicToggle');
    let isMuted = true;
    music.volume = 0.28; music.muted = true;
    document.addEventListener('click', () => music.play(), {once:true});
    musicToggle.addEventListener('click', () => {
      isMuted = !isMuted; music.muted = isMuted;
      musicToggle.textContent = isMuted ? '🔇 Music' : '🔊 Music';
    });
  });

  // Floating hearts
  const heartsContainer = document.getElementById('hearts-container');
  const heartGif = 'hearts-spin.gif';
  function spawnHeart() { 
    const heart = document.createElement('img'); 
    heart.src=heartGif; 
    heart.className='heart'; 
    heart.style.left=Math.random()*(window.innerWidth-70)+'px'; 
    heart.style.top=Math.random()*(window.innerHeight-70)+'px'; 
    heartsContainer.appendChild(heart); 
    setTimeout(()=>heartsContainer.removeChild(heart),3000);
  }
  setInterval(spawnHeart,500);

  // Floating auto comments
  const commentsContainer=document.getElementById('comments-container');
  const commentTexts=["Hi Daisy!","So cute!","I'm your biggest fan!","Love you!","Adorable!","Cutest dragon ever!","Wow!","Hello Daisy!"];
  function spawnComment(){
    const comment=document.createElement('div'); 
    comment.className='comment'; 
    comment.textContent=commentTexts[Math.floor(Math.random()*commentTexts.length)]; 
    comment.style.left=Math.random()*(window.innerWidth-100)+'px'; 
    comment.style.top=Math.random()*(window.innerHeight-50)+'px'; 
    commentsContainer.appendChild(comment); 
    setTimeout(()=>commentsContainer.removeChild(comment),4000);
  }
  setInterval(spawnComment,1000);

  // Reaction button
  const reactionButton=document.getElementById('reactionButton');
  const reactionSound=document.getElementById('reactionSound');
  reactionButton.addEventListener('click',()=>{
    reactionSound.currentTime=0; reactionSound.play();
    const start=Date.now();
    function burstHearts(){ if(Date.now()-start<2000){ for(let i=0;i<5;i++) spawnHeart(); setTimeout(burstHearts,80); } }
    burstHearts();
  });

  // Comment box
  const sendButton=document.getElementById('sendComment');
  const userInput=document.getElementById('userComment');
  sendButton.addEventListener('click',()=>{
    if(userInput.value.trim()!==""){
      const comment=document.createElement('div'); 
      comment.className='comment';
      comment.textContent=userInput.value;
      comment.style.left=Math.random()*(window.innerWidth-100)+'px';
      comment.style.top=(window.innerHeight-80)+'px';
      commentsContainer.appendChild(comment);
      setTimeout(()=>commentsContainer.removeChild(comment),4000);
      userInput.value='';
    }
  });
</script>
</body>
</html>
